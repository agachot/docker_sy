services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
    volumes:
      - pgsql:/var/lib/postgresql

  php_composer:
    image: ghcr.io/agachot/docker_sy:latest
    depends_on:
      - postgres

  nginx:
    image: nginx:1.31.1-alpine3.23
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - php_composer

volumes:
  pgsql:
