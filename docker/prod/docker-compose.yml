services:
  server_sf:
    container_name: server_sf
    image: nginx:1.31.1-alpine3.23
    working_dir: /www
    volumes:
      - './symfony:/www/symfony'
      - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    ports:
      -   '8080:80'
    networks:
      - prod_app

  app:
    container_name: app
    image: ghcr.io/agachot/docker_sy:latest
    env_file:
      -   .env
    networks:
      - prod_app

  postgres_sy:
    container_name: postgres_sy
    image: postgres:18.4-alpine3.24
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - 'pgsql:/var/lib/postgresql/18/docker'
    networks:
      - prod_app

volumes:
  pgsql:

networks:
  prod_app:
    driver: bridge